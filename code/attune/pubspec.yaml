name: attune
description: "Find community through your music taste"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  flutter_secure_storage: ^9.0.0
  http: ^1.2.1
  flutter_dotenv: ^5.1.0
  crypto: ^3.0.3
  url_launcher: ^6.2.0
  uni_links: ^0.5.1
  geolocator: ^13.0.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/images/ # we might not end up needing this
